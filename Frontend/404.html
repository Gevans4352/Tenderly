<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lostgarden — lost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green: #4a7c59;
        --cream: #f5edd8;
        --canvas: #2c1a12;
        --muted: #7a6a55;
        --font-serif: "Playfair Display", Georgia, serif;
        --font-sans: "DM Sans", system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--canvas);
        color: var(--cream);
        font-family: var(--font-sans);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 24px;
        max-width: 420px;
      }

      .tag {
        font-size: 0.68rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--green);
      }

      .title {
        font-family: var(--font-serif);
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 400;
        line-height: 1.1;
      }

      .subtitle {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .divider {
        width: 80px;
        height: 0.5px;
        background: var(--green);
        opacity: 0.4;
      }

      a {
        align-self: flex-start;
        font-family: var(--font-sans);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--canvas);
        background: var(--green);
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 999px;
        transition: opacity 0.2s ease;
      }

      a:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <p class="tag">exhibit · not found</p>
      <h1 class="title">this room<br />doesn't exist.</h1>
      <p class="subtitle">whatever you were looking for has already left.</p>
      <div class="divider"></div>
      <a href="/index.html">← back to the garden</a>
    </div>
  </body>
</html>
